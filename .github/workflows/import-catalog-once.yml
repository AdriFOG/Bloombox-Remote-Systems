name: One-time BloomBox Catalog migration

on:
  push:
    paths:
      - .github/workflows/import-catalog-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'AdriFOG/Bloombox-Remote-Systems'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Import verified catalog with full history; no release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --branch main --single-branch https://github.com/adri23rep-stack/BloomBox-Catalog.git source
          cd source
          SOURCE_HEAD="$(git rev-parse HEAD)"
          EXPECTED_SOURCE=06ca1a0a5f6918cacf95ce63019d7394ca04f591
          if [ "$SOURCE_HEAD" != "$EXPECTED_SOURCE" ]; then
            echo "::error::Original catalog changed; refusing migration"
            exit 1
          fi
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          if [ "$SOURCE_TREE" != "5039bb9161a53ec1985ce968f9c24fceb57f8f3a" ]; then
            echo "::error::Source tree differs from uploaded ZIP"
            exit 1
          fi

          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags destination main
          DEST_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$DEST_HEAD" != "$EXPECTED_TARGET" ]; then
            echo "::error::Destination changed during import; refusing migration"
            exit 1
          fi

          # GITHUB_TOKEN cannot edit other workflow files. Preserve the
          # temporary importer unchanged and restore check workflows later.
          git rm -rf -- .github/workflows
          git checkout "$DEST_HEAD" -- .github/workflows/import-catalog-once.yml
          TREE="$(git write-tree)"
          export GIT_AUTHOR_NAME="BloomBox Catalog Migration"
          export GIT_AUTHOR_EMAIL="noreply@github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          COMMIT="$(printf '%s\n' 'Migrate verified BloomBox-Catalog with complete history' '' 'Keep catalog, news and theme assets byte-identical to old main.' 'Preserve destination initial commit; publish no release.' | git commit-tree "$TREE" -p "$SOURCE_HEAD" -p "$DEST_HEAD")"
          git push destination "$COMMIT:refs/heads/main"
          echo "Migrated catalog source $SOURCE_HEAD to $COMMIT"
