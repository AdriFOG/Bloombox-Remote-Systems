name: Validate Port Store test badges

on:
  push:
    paths:
      - 'catalog/port-verifications.json'
      - 'Scripts/check-port-verifications.py'
      - '.github/workflows/port-verifications.yml'
  pull_request:
    paths:
      - 'catalog/port-verifications.json'
      - 'Scripts/check-port-verifications.py'
      - '.github/workflows/port-verifications.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/check-port-verifications.py
